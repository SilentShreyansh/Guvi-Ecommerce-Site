  <path d="M65,48 L35,88 L52,98 L65,78 L65,155 L135,155 L135,78 L148,98 L165,88 L135,48 Z" fill="#1e3a8a" stroke="#172554" stroke-width="2"/>
  <!-- Lapels -->
  <polygon points="65,48 100,105 85,108 65,70" fill="#1e40af"/>
  <polygon points="135,48 100,105 115,108 135,70" fill="#1e40af"/>
  <!-- Inner shirt & tie peeking -->
  <polygon points="85,48 115,48 100,75" fill="#ffffff"/>
  <polygon points="97,55 103,55 101,75 99,75" fill="#dc2626"/>
  <!-- Buttons -->
  <circle cx="100" cy="118" r="3" fill="#d97706"/>
  <circle cx="100" cy="132" r="3" fill="#d97706"/>
  <!-- Pockets -->
  <line x1="72" y1="130" x2="88" y2="130" stroke="#172554" stroke-width="2"/>
  <line x1="112" y1="130" x2="128" y2="130" stroke="#172554" stroke-width="2"/>
  <text x="100" y="180" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Tailored Navy Blazer</text>
</svg>
