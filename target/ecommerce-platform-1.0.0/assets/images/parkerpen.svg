<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Pen Cap -->
  <rect x="94" y="25" width="12" height="65" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Metal Arrow Clip -->
  <path d="M106,30 L112,30 L112,65 L108,72 L106,65 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <!-- Stainless steel band -->
  <rect x="94" y="88" width="12" height="4" fill="#cbd5e1"/>
  <!-- Pen Barrel -->
  <rect x="94" y="92" width="12" height="70" rx="1" fill="#1e293b"/>
  <!-- Pen Tip / Nib -->
  <polygon points="94,162 106,162 100,175" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="100" cy="174" r="1" fill="#0284c7"/>
  <text x="100" y="192" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Parker Vector Rollerball</text>
</svg>
