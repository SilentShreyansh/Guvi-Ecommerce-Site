<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Waistband -->
  <rect x="65" y="40" width="70" height="12" rx="4" fill="#3f3f46"/>
  <!-- Drawstring -->
  <path d="M96,52 L94,65 M104,52 L106,65" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M65,52 L68,145 L88,145 L97,75 L103,75 L112,145 L132,145 L135,52 Z" fill="#52525b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Cargo pockets -->
  <rect x="60" y="85" width="14" height="20" rx="2" fill="#3f3f46"/>
  <rect x="126" y="85" width="14" height="20" rx="2" fill="#3f3f46"/>
  <!-- Cuffs -->
  <rect x="68" y="145" width="20" height="8" rx="2" fill="#27272a"/>
  <rect x="112" y="145" width="20" height="8" rx="2" fill="#27272a"/>
  <text x="100" y="180" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Washed Cotton Cargo Joggers</text>
</svg>
