<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Hub body -->
  <rect x="40" y="70" width="120" height="60" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <!-- 4 USB Ports with individual switches and blue LEDs -->
  <g fill="#0284c7">
    <rect x="52" y="80" width="16" height="8" rx="1"/>
    <circle cx="60" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="110" r="4" fill="#0d9488"/>

    <rect x="78" y="80" width="16" height="8" rx="1"/>
    <circle cx="86" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="86" cy="110" r="4" fill="#0d9488"/>

    <rect x="104" y="80" width="16" height="8" rx="1"/>
    <circle cx="112" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="112" cy="110" r="4" fill="#0d9488"/>

    <rect x="130" y="80" width="16" height="8" rx="1"/>
    <circle cx="138" cy="95" r="2" fill="#38bdf8"/>
    <circle cx="138" cy="110" r="4" fill="#0d9488"/>
  </g>
  <!-- Cable -->
  <path d="M40,100 L20,100" stroke="#64748b" stroke-width="3"/>
  <rect x="10" y="94" width="10" height="12" rx="1" fill="#94a3b8"/>
  <text x="100" y="175" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Portronics 4-Port USB Hub</text>
</svg>
