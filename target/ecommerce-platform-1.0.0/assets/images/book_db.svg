  <text x="110" y="136" font-family="-apple-system, sans-serif" font-size="8" fill="#fef3c7" text-anchor="middle">Silberschatz • Korth</text>
  <text x="110" y="152" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">7th Edition • McGraw-Hill</text>
  <text x="100" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Database Concepts (Korth)</text>
