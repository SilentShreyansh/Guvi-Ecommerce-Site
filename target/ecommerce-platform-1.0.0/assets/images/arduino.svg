<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Arduino Teal Board -->
  <rect x="35" y="45" width="130" height="95" rx="6" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
  <!-- ATmega328P DIP Chip -->
  <rect x="70" y="88" width="55" height="18" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="97" y="100" font-family="-apple-system, sans-serif" font-size="6" fill="#cbd5e1" text-anchor="middle">ATmega328P</text>
  <!-- Headers -->
  <rect x="50" y="48" width="80" height="8" fill="#1e293b"/>
  <rect x="50" y="128" width="80" height="8" fill="#1e293b"/>
  <!-- USB Type-B Port -->
  <rect x="25" y="55" width="20" height="20" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <!-- Power Barrel Jack -->
  <rect x="25" y="105" width="22" height="18" fill="#0f172a"/>
  <!-- Reset button -->
  <circle cx="55" cy="80" r="4" fill="#dc2626"/>
  <!-- Infinity Logo / Text -->
  <text x="135" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="900">UNO</text>
  <text x="100" y="175" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Arduino Uno Starter Kit</text>
</svg>
