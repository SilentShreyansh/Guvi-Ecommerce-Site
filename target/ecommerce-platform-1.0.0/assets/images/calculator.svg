<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Calculator Body -->
  <rect x="55" y="25" width="90" height="150" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Solar cell & Brand -->
  <text x="75" y="42" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">CASIO</text>
  <rect x="105" y="34" width="30" height="10" rx="1" fill="#475569" stroke="#334155"/>
  <!-- LCD Natural Display -->
  <rect x="62" y="48" width="76" height="26" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="132" y="65" font-family="monospace" font-size="11" fill="#0f172a" text-anchor="end" font-weight="700">552 FUNCTIONS</text>
  <!-- Direction pad -->
  <circle cx="100" cy="86" r="8" fill="#475569"/>
  <!-- Key grid -->
  <g fill="#334155" stroke="#1e293b" stroke-width="1">
    <!-- Function keys -->
    <rect x="63" y="100" width="11" height="7" rx="1" fill="#d97706"/>
    <rect x="79" y="100" width="11" height="7" rx="1"/>
    <rect x="95" y="100" width="11" height="7" rx="1"/>
    <rect x="111" y="100" width="11" height="7" rx="1"/>
    <rect x="127" y="100" width="11" height="7" rx="1"/>
    <!-- Numeric keys -->
    <rect x="63" y="112" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="83" y="112" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="103" y="112" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="123" y="112" width="15" height="10" rx="1" fill="#dc2626"/>

    <rect x="63" y="126" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="83" y="126" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="103" y="126" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="123" y="126" width="15" height="10" rx="1" fill="#0d9488"/>

    <rect x="63" y="140" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="83" y="140" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="103" y="140" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="123" y="140" width="15" height="10" rx="1" fill="#475569"/>

    <rect x="63" y="154" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="83" y="154" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="103" y="154" width="15" height="10" rx="1" fill="#64748b"/>
    <rect x="123" y="154" width="15" height="10" rx="1" fill="#0d9488"/>
  </g>
  <text x="100" y="193" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Casio FX-991EX ClassWiz</text>
</svg>
