<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Hood -->
  <path d="M78,50 C78,25 122,25 122,50" fill="none" stroke="#0e7490" stroke-width="12" stroke-linecap="round"/>
  <!-- Jacket Body & Sleeves -->
  <path d="M66,55 L32,92 L48,102 L64,82 L64,150 L136,150 L136,82 L152,102 L168,92 L134,55 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="2"/>
  <!-- Waterproof Zipper -->
  <line x1="100" y1="52" x2="100" y2="150" stroke="#164e63" stroke-width="2.5"/>
  <!-- Storm pockets -->
  <line x1="72" y1="115" x2="88" y2="125" stroke="#164e63" stroke-width="2"/>
  <line x1="128" y1="115" x2="112" y2="125" stroke="#164e63" stroke-width="2"/>
  <!-- Raindrops -->
  <path d="M45,45 L42,52 M155,42 L152,49 M165,65 L162,72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="175" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Waterproof Rain Jacket</text>
</svg>
