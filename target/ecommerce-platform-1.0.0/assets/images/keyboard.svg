<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Keyboard Frame -->
  <rect x="25" y="60" width="150" height="85" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Key rows -->
  <g fill="#475569" stroke="#334155" stroke-width="1">
    <!-- Function Row -->
    <rect x="32" y="68" width="10" height="8" rx="1"/>
    <rect x="45" y="68" width="10" height="8" rx="1"/>
    <rect x="58" y="68" width="10" height="8" rx="1"/>
    <rect x="71" y="68" width="10" height="8" rx="1"/>
    <rect x="87" y="68" width="10" height="8" rx="1"/>
    <rect x="100" y="68" width="10" height="8" rx="1"/>
    <rect x="113" y="68" width="10" height="8" rx="1"/>
    <rect x="129" y="68" width="10" height="8" rx="1"/>
    <rect x="145" y="68" width="22" height="8" rx="1"/>
    <!-- Row 1 -->
    <rect x="32" y="80" width="12" height="10" rx="1"/>
    <rect x="47" y="80" width="10" height="10" rx="1"/>
    <rect x="60" y="80" width="10" height="10" rx="1"/>
    <rect x="73" y="80" width="10" height="10" rx="1"/>
    <rect x="86" y="80" width="10" height="10" rx="1"/>
    <rect x="99" y="80" width="10" height="10" rx="1"/>
    <rect x="112" y="80" width="10" height="10" rx="1"/>
    <rect x="125" y="80" width="10" height="10" rx="1"/>
    <rect x="138" y="80" width="12" height="10" rx="1"/>
    <rect x="153" y="80" width="14" height="10" rx="1"/>
    <!-- Row 2 -->
    <rect x="32" y="94" width="15" height="10" rx="1"/>
    <rect x="50" y="94" width="10" height="10" rx="1"/>
    <rect x="63" y="94" width="10" height="10" rx="1"/>
    <rect x="76" y="94" width="10" height="10" rx="1"/>
    <rect x="89" y="94" width="10" height="10" rx="1"/>
    <rect x="102" y="94" width="10" height="10" rx="1"/>
    <rect x="115" y="94" width="10" height="10" rx="1"/>
    <rect x="128" y="94" width="10" height="10" rx="1"/>
    <rect x="141" y="94" width="26" height="10" rx="1" fill="#0d9488"/>
    <!-- Spacebar row -->
    <rect x="32" y="108" width="18" height="10" rx="1"/>
    <rect x="53" y="108" width="12" height="10" rx="1"/>
    <rect x="68" y="108" width="60" height="10" rx="1"/>
    <rect x="131" y="108" width="12" height="10" rx="1"/>
    <rect x="146" y="108" width="21" height="10" rx="1"/>
  </g>
  <!-- Cable -->
  <path d="M100,60 C100,45 130,45 130,30" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <!-- Status LEDs -->
  <circle cx="158" cy="72" r="1.5" fill="#10b981"/>
  <circle cx="163" cy="72" r="1.5" fill="#10b981"/>
  <text x="100" y="180" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">TVS Mechanical Keyboard</text>
</svg>
