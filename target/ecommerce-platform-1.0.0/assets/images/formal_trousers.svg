<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Waistband -->
  <rect x="68" y="40" width="64" height="12" rx="3" fill="#1e293b"/>
  <!-- Belt loops -->
  <rect x="74" y="40" width="3" height="12" fill="#334155"/>
  <rect x="98" y="40" width="3" height="12" fill="#334155"/>
  <rect x="123" y="40" width="3" height="12" fill="#334155"/>
  <!-- Legs with center pressed crease -->
  <path d="M68,52 L66,155 L88,155 L98,75 L102,75 L112,155 L134,155 L132,52 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <!-- Creases -->
  <line x1="77" y1="56" x2="77" y2="155" stroke="#1e293b" stroke-width="1"/>
  <line x1="123" y1="56" x2="123" y2="155" stroke="#1e293b" stroke-width="1"/>
  <text x="100" y="180" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Tailored Formal Trousers</text>
</svg>
