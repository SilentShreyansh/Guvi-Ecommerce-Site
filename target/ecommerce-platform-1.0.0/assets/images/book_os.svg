<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Book Cover -->
  <rect x="55" y="30" width="95" height="135" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <rect x="55" y="30" width="12" height="135" rx="1" fill="#075985"/>
  <!-- Pages edge -->
  <path d="M150,35 L155,38 L155,168 L150,165 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M60,165 L65,168 L155,168 L150,165 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Dinosaur / Silberschatz symbol -->
  <circle cx="110" cy="70" r="16" fill="#38bdf8" opacity="0.3"/>
  <!-- Title text on cover -->
  <text x="110" y="98" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800">OPERATING</text>
  <text x="110" y="110" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800">SYSTEM</text>
  <text x="110" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="800">CONCEPTS</text>
  <text x="110" y="138" font-family="-apple-system, sans-serif" font-size="8" fill="#e0f2fe" text-anchor="middle">Silberschatz • Galvin</text>
  <text x="110" y="154" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">10th Edition</text>
  <text x="100" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">OS Concepts (Wiley)</text>
</svg>
