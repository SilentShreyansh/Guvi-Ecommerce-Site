  <!-- Bag Body -->
  <path d="M65,58 C65,45 135,45 135,58 L140,145 C140,152 135,155 125,155 L75,155 C65,155 60,152 60,145 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
