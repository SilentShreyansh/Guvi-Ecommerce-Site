  <!-- Leather straps -->
  <rect x="80" y="55" width="6" height="50" rx="2" fill="#78350f"/>
  <rect x="114" y="55" width="6" height="50" rx="2" fill="#78350f"/>
  <circle cx="83" cy="98" r="2" fill="#fef08a"/>
  <circle cx="117" cy="98" r="2" fill="#fef08a"/>
  <text x="100" y="180" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Campus Canvas Backpack</text>
</svg>
