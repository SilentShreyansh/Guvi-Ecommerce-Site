<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Mouse Body -->
  <path d="M70,70 C70,40 130,40 130,70 L130,130 C130,165 70,165 70,130 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <!-- Mouse Buttons Divider -->
  <path d="M100,42 L100,90" stroke="#64748b" stroke-width="2"/>
  <path d="M70,85 L130,85" stroke="#64748b" stroke-width="2"/>
  <!-- Scroll Wheel -->
  <rect x="96" y="55" width="8" height="22" rx="4" fill="#0d9488"/>
  <!-- Cable -->
  <path d="M100,42 C100,20 120,20 120,5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Optical Glow / Sensor indicator -->
  <ellipse cx="100" cy="130" rx="14" ry="20" fill="#1e293b" opacity="0.6"/>
  <text x="100" y="185" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Logitech B100 USB</text>
</svg>
