<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Handle -->
  <rect x="40" y="115" width="55" height="18" rx="6" fill="#f97316" stroke="#ea580c" stroke-width="2" transform="rotate(-30 67 124)"/>
  <!-- Metal barrel -->
  <rect x="95" y="85" width="45" height="10" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-30 117 90)"/>
  <!-- Tip -->
  <polygon points="152,70 162,64 147,60" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <!-- Cable -->
  <path d="M42,135 C25,145 35,165 20,170" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Stand -->
  <polygon points="100,140 140,140 150,155 90,155" fill="#334155"/>
  <rect x="95" y="153" width="50" height="4" fill="#64748b"/>
  <text x="100" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Soldron 25W Soldering Iron</text>
</svg>
