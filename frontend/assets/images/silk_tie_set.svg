<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Tie Knot -->
  <polygon points="75,35 95,35 88,52 82,52" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Tie Body -->
  <polygon points="82,52 88,52 94,130 85,150 76,130" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
  <!-- Micro patterns on tie -->
  <circle cx="85" cy="70" r="1.5" fill="#fde047"/>
  <circle cx="85" cy="90" r="1.5" fill="#fde047"/>
  <circle cx="85" cy="110" r="1.5" fill="#fde047"/>
  <circle cx="85" cy="130" r="1.5" fill="#fde047"/>
  <!-- Folded Pocket Square -->
  <polygon points="120,80 145,50 155,75 135,100" fill="#b91c1c" stroke="#991b1b" stroke-width="1.5"/>
  <polygon points="135,70 155,45 160,65" fill="#dc2626"/>
  <text x="100" y="175" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Silk Tie &amp; Pocket Square Set</text>
</svg>
