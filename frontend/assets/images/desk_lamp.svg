<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc"/>
  <!-- Base -->
  <ellipse cx="100" cy="155" rx="35" ry="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="100" cy="154" r="4" fill="#38bdf8"/>
  <!-- Stem -->
  <path d="M100,150 C100,90 140,80 130,55" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <!-- Lamp head -->
  <ellipse cx="120" cy="50" rx="25" ry="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" transform="rotate(-25 120 50)"/>
  <!-- Light glow -->
  <polygon points="105,62 135,48 160,110 80,120" fill="#fef08a" opacity="0.3"/>
  <text x="100" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">Rechargeable LED Desk Lamp</text>
</svg>
